<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img"><title>G01/G02/G07 请求恢复状态</title><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1440" height="860" rx="0" fill="#F3F6FB" stroke="#7B8A98"/><text x="32" y="44" font-size="24" fill="#17212B" font-weight="600">CodexAssistant · 请求状态与恢复入口</text><rect x="32" y="90" width="436" height="310" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="56" y="134" font-size="19" fill="#17212B" font-weight="600">无缓存 / 正在读取</text><rect x="56" y="170" width="388" height="80" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="72" y="201" font-size="15" fill="#17212B" font-weight="400">显示骨架，不显示零值或暂无记录。</text><rect x="56" y="312" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="72" y="340" font-size="14" fill="#17212B" font-weight="400">等待读取</text><rect x="492" y="90" width="436" height="310" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="516" y="134" font-size="19" fill="#17212B" font-weight="600">离线 / 有缓存</text><rect x="516" y="170" width="388" height="80" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="532" y="201" font-size="15" fill="#17212B" font-weight="400">保留上次同步内容；本地操作仍可用。</text><rect x="516" y="312" width="200" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="532" y="340" font-size="14" fill="#FFFFFF" font-weight="400">编辑连接</text><rect x="952" y="90" width="436" height="310" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="976" y="134" font-size="19" fill="#17212B" font-weight="600">读取失败</text><rect x="976" y="170" width="388" height="80" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="992" y="201" font-size="15" fill="#17212B" font-weight="400">显示持续错误区；重试原来的只读查询。</text><rect x="976" y="312" width="200" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="992" y="340" font-size="14" fill="#FFFFFF" font-weight="400">重试读取</text><rect x="32" y="430" width="436" height="310" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="56" y="474" font-size="19" fill="#17212B" font-weight="600">写入结果未确认</text><rect x="56" y="510" width="388" height="80" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="72" y="541" font-size="15" fill="#17212B" font-weight="400">保留输入；查询原资源，不能自动重发。</text><rect x="56" y="652" width="200" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="72" y="680" font-size="14" fill="#FFFFFF" font-weight="400">查询状态</text><rect x="492" y="430" width="436" height="310" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="516" y="474" font-size="19" fill="#17212B" font-weight="600">权限不足 / 403</text><rect x="516" y="510" width="388" height="80" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="532" y="541" font-size="15" fill="#17212B" font-weight="400">显示权限不足；重试不能提升权限。</text><rect x="516" y="652" width="200" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="532" y="680" font-size="14" fill="#FFFFFF" font-weight="400">返回</text><rect x="952" y="430" width="436" height="310" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="976" y="474" font-size="19" fill="#17212B" font-weight="600">请求过多 / 429</text><rect x="976" y="510" width="388" height="80" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="992" y="541" font-size="15" fill="#17212B" font-weight="400">读取 Retry-After；倒计时结束后允许手动重试</text><text x="992" y="564" font-size="15" fill="#17212B" font-weight="400">。</text><rect x="976" y="652" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="992" y="680" font-size="14" fill="#17212B" font-weight="400">等待倒计时</text><text x="32" y="820" font-size="16" fill="#52616E" font-weight="400">这是六个独立分支，不是顺序流程；后续业务状态必须来自真实回执。</text></svg>