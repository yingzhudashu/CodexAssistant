<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img"><title>首次连接 · 保存并连接</title><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1440" height="610" rx="0" fill="#F3F6FB" stroke="#7B8A98"/><text x="32" y="40" font-size="23" fill="#17212B" font-weight="600">CA-01.I01  保存并连接</text><text x="32" y="70" font-size="14" fill="#52616E" font-weight="400">动作状态图 · 完成与失败是互斥分支；本地动作不等待服务端；失败不是完成后的下一步</text><rect x="32" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="32" y="110" width="326" height="50" rx="12" fill="#E6F0FF" stroke="#7B8A98"/><text x="48" y="143" font-size="18" fill="#17212B" font-weight="600">操作前</text><text x="48" y="192" font-size="16" fill="#17212B" font-weight="600">首次连接</text><text x="48" y="228" font-size="12" fill="#52616E" font-weight="400">服务地址</text><rect x="48" y="242" width="294" height="48" rx="8" fill="#F3F6FB" stroke="#7B8A98"/><text x="60" y="272" font-size="13" fill="#17212B" font-weight="400">https://monitor.example.test</text><text x="48" y="323" font-size="15" fill="#17212B" font-weight="400">服务地址和凭据满足字段规则；允许离线</text><text x="48" y="346" font-size="15" fill="#17212B" font-weight="400">保存到本机安全存储，同一时刻只有一条</text><text x="48" y="369" font-size="15" fill="#17212B" font-weight="400">配置保存。</text><rect x="48" y="482" width="294" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="64" y="510" font-size="14" fill="#FFFFFF" font-weight="400">保存并连接</text><rect x="382" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="382" y="110" width="326" height="50" rx="12" fill="#E6F0FF" stroke="#7B8A98"/><text x="398" y="143" font-size="18" fill="#17212B" font-weight="600">执行中</text><text x="398" y="192" font-size="16" fill="#17212B" font-weight="600">首次连接</text><text x="398" y="228" font-size="12" fill="#52616E" font-weight="400">服务地址</text><rect x="398" y="242" width="294" height="48" rx="8" fill="#F3F6FB" stroke="#7B8A98"/><text x="410" y="272" font-size="13" fill="#17212B" font-weight="400">https://monitor.example.test</text><text x="398" y="323" font-size="15" fill="#17212B" font-weight="400">执行对应本机或系统调用；不以调用开始</text><text x="398" y="346" font-size="15" fill="#17212B" font-weight="400">推断最终业务完成。</text><rect x="398" y="482" width="294" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="414" y="510" font-size="14" fill="#17212B" font-weight="400">处理中…</text><rect x="732" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="732" y="110" width="326" height="50" rx="12" fill="#E6F0FF" stroke="#7B8A98"/><text x="748" y="143" font-size="18" fill="#17212B" font-weight="600">完成分支</text><text x="748" y="192" font-size="16" fill="#17212B" font-weight="600">首次连接</text><text x="748" y="228" font-size="12" fill="#52616E" font-weight="400">服务地址</text><rect x="748" y="242" width="294" height="48" rx="8" fill="#F3F6FB" stroke="#7B8A98"/><text x="760" y="272" font-size="13" fill="#17212B" font-weight="400">https://monitor.example.test</text><text x="748" y="323" font-size="15" fill="#17212B" font-weight="400">保存成功后进入CA-03；连接横幅仍显示</text><text x="748" y="346" font-size="15" fill="#17212B" font-weight="400">真实握手状态，收到snapshot才显示同</text><text x="748" y="369" font-size="15" fill="#17212B" font-weight="400">步完成。</text><rect x="748" y="482" width="294" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="764" y="510" font-size="14" fill="#17212B" font-weight="400">完成后保留结果</text><rect x="1082" y="110" width="326" height="440" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="1082" y="110" width="326" height="50" rx="12" fill="#E6F0FF" stroke="#7B8A98"/><text x="1098" y="143" font-size="18" fill="#17212B" font-weight="600">失败分支</text><text x="1098" y="192" font-size="16" fill="#17212B" font-weight="600">首次连接</text><text x="1098" y="228" font-size="12" fill="#52616E" font-weight="400">服务地址</text><rect x="1098" y="242" width="294" height="48" rx="8" fill="#F3F6FB" stroke="#7B8A98"/><text x="1110" y="272" font-size="13" fill="#17212B" font-weight="400">https://monitor.example.test</text><text x="1098" y="323" font-size="15" fill="#17212B" font-weight="400">安全存储失败则留在表单并显示原因，旧</text><text x="1098" y="346" font-size="15" fill="#17212B" font-weight="400">配置保持有效；保存成功但网络握手失败</text><text x="1098" y="369" font-size="15" fill="#17212B" font-weight="400">则保留新配置，进入任务页显示连接错误</text><text x="1098" y="392" font-size="15" fill="#17212B" font-weight="400">和“编辑连接”入口。</text><rect x="1098" y="482" width="294" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="1114" y="510" font-size="14" fill="#17212B" font-weight="400">保留输入 / 查看原因</text><text x="32" y="587" font-size="13" fill="#52616E" font-weight="400">返回/关闭：离开不取消已发出的写操作；连接编辑按G14确认，普通任务草稿保留。</text></svg>