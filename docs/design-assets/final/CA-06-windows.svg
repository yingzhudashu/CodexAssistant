<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>向工作站发送消息 / Windows</title><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FB" stroke="#7B8A98"/><rect x="0" y="0" width="1440" height="32" rx="0" fill="#FFFFFF" stroke="#7B8A98"/><text x="16" y="22" font-size="13" fill="#17212B" font-weight="400">CodexAssistant  —  Windows</text><text x="1322" y="23" font-size="17" fill="#17212B" font-weight="400">—    □    ×</text><rect x="0" y="32" width="240" height="868" rx="0" fill="#FFFFFF" stroke="#7B8A98"/><text x="18" y="68" font-size="17" fill="#17212B" font-weight="600">CodexAssistant</text><rect x="12" y="108" width="216" height="44" rx="8" fill="#E6F0FF" stroke="#7B8A98"/><text x="24" y="136" font-size="15" fill="#17212B" font-weight="400">任务</text><rect x="12" y="160" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="24" y="188" font-size="15" fill="#17212B" font-weight="400">连接状态</text><rect x="12" y="212" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="24" y="240" font-size="15" fill="#17212B" font-weight="400">外观</text><rect x="12" y="264" width="216" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="24" y="292" font-size="15" fill="#17212B" font-weight="400">关于</text><text x="272" y="70" font-size="20" fill="#17212B" font-weight="600">CA-06 向工作站发送消息</text><text x="272" y="100" font-size="13" fill="#52616E" font-weight="400">向工作站发送消息 · 当前示例仅供布局验收</text><rect x="440.0" y="144" width="800" height="46" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="452.0" y="172" font-size="13" fill="#17212B" font-weight="400">目标任务：同步协调器</text><rect x="440.0" y="202" width="800" height="46" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="452.0" y="230" font-size="13" fill="#17212B" font-weight="400">发送状态：尚未发送</text><text x="456.0" y="340" font-size="20" fill="#17212B" font-weight="600">草稿尚未发送</text><text x="456.0" y="372" font-size="14" fill="#52616E" font-weight="400">确认输入后点击发送，不生成虚假回执。</text><rect x="440.0" y="694" width="800" height="80" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="454.0" y="725" font-size="14" fill="#17212B" font-weight="400">请补充断线恢复的检查结果。</text><rect x="270" y="798" width="1140" height="72" rx="0" fill="#F3F6FB" stroke="#F3F6FB"/><rect x="272" y="808" width="64" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="288" y="836" font-size="14" fill="#FFFFFF" font-weight="400">发送</text><rect x="348" y="808" width="96" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="364" y="836" font-size="14" fill="#17212B" font-weight="400">清空草稿</text><text x="272" y="880" font-size="12" fill="#52616E" font-weight="400">设计基线 · 合成示例 · 表单与状态以本页规则为准</text></svg>