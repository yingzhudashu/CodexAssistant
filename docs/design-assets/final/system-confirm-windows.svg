<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>G14 放弃修改确认层</title><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FB" stroke="#7B8A98"/><text x="16" y="24" font-size="16" fill="#17212B" font-weight="600">CodexAssistant · Windows</text><text x="1322" y="24" font-size="17" fill="#17212B" font-weight="400">—    □    ×</text><text x="272" y="94" font-size="20" fill="#17212B" font-weight="600">正在编辑 · 未保存修改</text><rect x="272" y="130" width="880" height="160" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><rect x="0" y="32" width="1440" height="868" fill="#17212B" opacity="0.40"/><rect x="480.0" y="310" width="480" height="230" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="504.0" y="354" font-size="20" fill="#17212B" font-weight="600">放弃未保存内容？</text><text x="504.0" y="395" font-size="16" fill="#17212B" font-weight="400">离开后，本次未保存的修改将丢失。</text><rect x="504.0" y="467" width="210.0" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="520.0" y="495" font-size="14" fill="#17212B" font-weight="400">继续编辑</text><rect x="500.0" y="463" width="218.0" height="52" fill="none" stroke="#2457A6" stroke-width="2" rx="10"/><rect x="726.0" y="467" width="210.0" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="742.0" y="495" font-size="14" fill="#FFFFFF" font-weight="400">放弃并离开</text><text x="272" y="800" font-size="15" fill="#17212B" font-weight="600">默认焦点：继续编辑</text><text x="272" y="830" font-size="14" fill="#17212B" font-weight="400">Esc / 返回 / 遮罩：继续编辑；确认后只丢弃本表单。</text></svg>