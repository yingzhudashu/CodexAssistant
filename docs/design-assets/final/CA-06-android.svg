<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>向工作站发送消息 / Android</title><style>text{font-family:"Microsoft YaHei","Segoe UI",sans-serif}</style><rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6FB" stroke="#7B8A98"/><rect x="0" y="0" width="390" height="24" rx="0" fill="#FFFFFF" stroke="#7B8A98"/><text x="20" y="17" font-size="12" fill="#17212B" font-weight="400">09:41</text><text x="298" y="17" font-size="11" fill="#17212B" font-weight="400">5G   100%</text><text x="16" y="62" font-size="20" fill="#17212B" font-weight="600">CA-06 向工作站发送消息</text><text x="16" y="92" font-size="13" fill="#52616E" font-weight="400">向工作站发送消息 · 当前示例仅供布局验收</text><rect x="16.0" y="136" width="358" height="46" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="28.0" y="164" font-size="13" fill="#17212B" font-weight="400">目标任务：同步协调器</text><rect x="16.0" y="194" width="358" height="46" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="28.0" y="222" font-size="13" fill="#17212B" font-weight="400">发送状态：尚未发送</text><text x="32.0" y="332" font-size="20" fill="#17212B" font-weight="600">草稿尚未发送</text><text x="32.0" y="364" font-size="14" fill="#52616E" font-weight="400">确认输入后点击发送，不生成虚假回执。</text><rect x="16.0" y="598" width="358" height="80" rx="12" fill="#FFFFFF" stroke="#7B8A98"/><text x="30.0" y="629" font-size="14" fill="#17212B" font-weight="400">请补充断线恢复的检查结果。</text><rect x="14" y="702" width="362" height="72" rx="0" fill="#F3F6FB" stroke="#F3F6FB"/><rect x="16" y="712" width="173" height="44" rx="8" fill="#2457A6" stroke="#7B8A98"/><text x="32" y="740" font-size="14" fill="#FFFFFF" font-weight="400">发送</text><rect x="201" y="712" width="173" height="44" rx="8" fill="#FFFFFF" stroke="#7B8A98"/><text x="217" y="740" font-size="14" fill="#17212B" font-weight="400">清空草稿</text><rect x="145.0" y="835" width="100" height="4" rx="2" fill="#17212B" stroke="#17212B"/></svg>