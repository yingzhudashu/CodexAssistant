# 此文件必须 include 在 server.example.com 的 HTTPS server 块内，而不是作为独立 server。
# 所有公网请求仍由现有 TLS、HSTS 和主站日志策略覆盖。
location = /codex-assistant {
    return 308 /codex-assistant/;
}

location = /codex-assistant/downloads/manifest.json {
    alias /srv/www/codex-assistant/downloads/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /codex-assistant/downloads/ {
    alias /srv/www/codex-assistant/downloads/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /codex-assistant/ {
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:3240/codex-assistant/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header traceparent $http_traceparent;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
}

location = /codex-assistant/api/v2/stream {
    proxy_pass http://127.0.0.1:3240/codex-assistant/api/v2/stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}
